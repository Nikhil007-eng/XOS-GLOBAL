<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNX — Powered by XOS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --bg: #000000; --accent: #007aff; --card: #0a0a0a; --border: #1a1a1a; --glass: rgba(10, 10, 10, 0.85); --text: #ffffff; --muted: #666666; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
#topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 60px; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; background: linear-gradient(to bottom, var(--bg) 60%, transparent); pointer-events: none; }
.brand-zynx { font-size: 14px; font-weight: 700; letter-spacing: 4px; color: #fff; text-transform: uppercase; }
.tagline-xos { font-size: 8px; font-weight: 500; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-top: 2px; }
#reel-wrap { width: 100%; height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none; }
#reel-wrap::-webkit-scrollbar { display: none; }
.reel { width: 100%; height: 100dvh; flex-shrink: 0; position: relative; background: var(--bg); overflow: hidden; scroll-snap-align: start; scroll-snap-stop: always; }
.reel-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.reel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%); pointer-events: none; z-index: 1; }
.progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.1); z-index: 20; }
.progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
.side-actions { position: absolute; right: 16px; bottom: 110px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.act:active { transform: scale(0.85); }
.act-icon { width: 50px; height: 50px; border-radius: 50%; background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(25px); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text); }
.act-icon.liked { color: #ff3b5c; border-color: #ff3b5c; box-shadow: 0 0 15px rgba(255, 59, 92, 0.2); }
.act-label { font-size: 9px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }

/* Music disc bottom-right */
.music-disc { width: 50px; height: 50px; border-radius: 50%; background: var(--glass); border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; display: flex; align-items: center; justify-content: center; }
.music-disc:active { transform: scale(0.9); }
.music-disc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; border-radius: 50%; }
.music-disc i { position: relative; z-index: 1; font-size: 16px; color: #fff; }
.music-disc.spinning img { animation: discSpin 3s linear infinite; }
@keyframes discSpin { to { transform: rotate(360deg); } }

.reel-info { position: absolute; bottom: 0; left: 0; right: 80px; z-index: 10; padding: 0 24px 44px; }
.author-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.author-pfp { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover; }
.author-link { text-decoration: none; color: inherit; }
.author-name { font-weight: 600; font-size: 13px; letter-spacing: 0.5px; transition: color 0.2s; }
.author-link:hover .author-name { color: var(--accent); }
.reel-caption { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.75); max-width: 90%; }

#vol-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 64px; height: 64px; background: var(--glass); border: 1px solid var(--border); border-radius: 50%; backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; font-size: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#vol-indicator.show { opacity: 1; }
.dtap-heart { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; pointer-events: none; }
.dtap-heart i { font-size: 80px; color: #fff; opacity: 0; transform: scale(0.5); }
.dtap-heart i.pop { animation: heartPop 0.7s forwards; }
@keyframes heartPop { 0% { opacity: 0; transform: scale(0.5); } 30% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1); } }

/* Loading screen */
#zynx-loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
#zynx-loader.hidden { display: none; }
.spin-ring { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.08); border-top: 2px solid var(--accent); border-radius: 50%; animation: discSpin 0.8s linear infinite; }
</style>
</head>
<body>
<div id="zynx-loader">
    <div class="spin-ring"></div>
    <p style="font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:3px;text-transform:uppercase;font-family:'Space Grotesk';">Loading Zynx</p>
</div>
<div id="topbar"><span class="brand-zynx">ZYNX</span><span class="tagline-xos">Powered by XOS</span></div>
<div id="reel-wrap"><div id="reel-track"></div></div>
<div id="vol-indicator"><i class="fas fa-volume-up"></i></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
    apiKey: "AIzaSyAUk6bBCFPoq-Tu-AiX1nD3LFvhc6g7B7g",
    authDomain: "steel-melody-464711-d6.firebaseapp.com",
    databaseURL: "https://steel-melody-464711-d6-default-rtdb.firebaseio.com",
    projectId: "steel-melody-464711-d6",
    storageBucket: "steel-melody-464711-d6.firebasestorage.app",
    messagingSenderId: "288849938458",
    appId: "1:288849938458:web:d615242bb9f1e1ee0fe9a3"
});
const db = firebase.database();

const TG_BOT = "8668013778:AAEnWA0uY3tDUOQP1uHQEVJdcAGaWgfy4eA";
const TG_CID = "7217028526";
const EXTRACTED_USER = sessionStorage.getItem('userName') || "Guest User";

// ── OLD HARDCODED POSTS (always shown) ──────────────────────────────────────
const STATIC_POSTS = [
  { id: 'static_niranjan', user: { name: "NIRANJAN", pfp: "https://nikhil007-eng.github.io/xosint/IMG-20260222-WA0034%20(1).jpg", url: "https://nikhil007-eng.github.io/xosint/" }, src: "https://nikhil007-eng.github.io/xosint/nirup1.mp4", type: "video", audio: "", caption: "Nothing Phone (4a) — Built different.", likes: 1, timestamp: 0 },
  { id: 'static_anush', user: { name: "ANUSH", pfp: "https://nikhil007-eng.github.io/xosintanush/Screenshot_20260221-160725.png", url: "https://nikhil007-eng.github.io/xosintanush/" }, src: "https://nikhil007-eng.github.io/xosintanush/lv_0_20260226150449.mp4", type: "video", audio: "", caption: "journey from 12th to healing hands.", likes: 1, timestamp: 0 },
  { id: 'static_nikhil', user: { name: "NIKHIL", pfp: "https://nikhil007-eng.github.io/Developer-xos-/file_00000000f4f47208a731ff7b47a3b568.png", url: "https://nikhil007-eng.github.io/Developer-xos-/Nikhilprof.html" }, src: "https://nikhil007-eng.github.io/Developer-xos-/Picsart_26-02-28_14-41-10-477.jpg", type: "image", audio: "From_The_Start(256k).mp3", caption: "Image(her pfp) 😅.", likes: 1, timestamp: 0 }
];

let POSTS = [];
let muted = false;
let liked = JSON.parse(localStorage.getItem('xos_liked_v2') || '{}');

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        const audio = entry.target.querySelector('audio');
        const bar = entry.target.querySelector('.progress-bar');
        const disc = entry.target.querySelector('.music-disc');

        if (entry.isIntersecting) {
            if (video) {
                video.muted = muted;
                video.currentTime = 0;
                video.play().catch(() => {});
                video.ontimeupdate = () => { if (video.duration) bar.style.width = (video.currentTime / video.duration * 100) + '%'; };
            }
            if (audio) {
                audio.muted = muted;
                audio.currentTime = 0;
                audio.play().catch(() => {});
                audio.ontimeupdate = () => { if (audio.duration) bar.style.width = (audio.currentTime / audio.duration * 100) + '%'; };
                if (disc) disc.classList.add('spinning');
            }
        } else {
            if (video) { video.pause(); video.muted = true; video.ontimeupdate = null; bar.style.width = '0%'; }
            if (audio) { audio.pause(); audio.muted = true; audio.ontimeupdate = null; bar.style.width = '0%'; }
            if (disc) disc.classList.remove('spinning');
        }
    });
}, { threshold: 0.6 });

async function loadPosts() {
    const allPosts = [];

    const profilesSnap = await db.ref('profiles').once('value');
    const profiles = profilesSnap.val() || {};

    // Auto-discover every user in profiles
    let allUserIds = Object.keys(profiles);

    // 🔥 ADD NIKHIL EVEN IF NOT IN PROFILES
    if (!allUserIds.includes('nikhil')) {
        allUserIds.push('nikhil');
    }

    const promises = allUserIds.map(uid =>
        db.ref(uid + '/posts').once('value').then(snap => {
            const data = snap.val();
            if (!data) return;
            const profile = profiles[uid] || {};
            let pfp = profile.photo || '';
            let displayName = (profile.name || uid).toUpperCase();

            // 🔥 If this is nikhil and no profile, use defaults
            if (uid === 'nikhil' && !profile.name) {
                displayName = 'NIKHIL';
                pfp = pfp || 'https://nikhil007-eng.github.io/Developer-xos-/file_00000000f4f47208a731ff7b47a3b568.png';
            }

            const profileUrl = `profile.html?u=${uid}`;
            const songName = profile.songName || '';

            Object.entries(data).forEach(([postId, v]) => {
                if (!v.src) return;
                allPosts.push({
                    id: uid + '_' + postId,
                    uid,
                    user: { name: displayName, pfp, url: profileUrl },
                    src: v.src,
                    type: v.type || 'image',
                    audio: v.audio || '',
                    songName: v.songName || songName || '',
                    caption: v.caption || '',
                    timestamp: v.timestamp || 0,
                    likes: 1
                });
            });
        }).catch(() => {})
    );

    await Promise.all(promises);
    allPosts.sort((a, b) => b.timestamp - a.timestamp);

    // Merge: Firebase posts first, then static posts deduped by src
    const firebaseSrcs = new Set(allPosts.map(p => p.src));
    const dedupedStatic = STATIC_POSTS.filter(p => !firebaseSrcs.has(p.src));
    POSTS = [...allPosts, ...dedupedStatic];

    document.getElementById('zynx-loader').classList.add('hidden');
    build();
}

function build() {
    const track = document.getElementById('reel-track');
    track.innerHTML = '';

    if (!POSTS.length) {
        track.innerHTML = `<div style="width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
            <i class="fas fa-film" style="font-size:32px;color:#222;"></i>
            <p style="font-size:10px;color:#333;letter-spacing:2px;text-transform:uppercase;">No posts yet</p>
        </div>`;
        return;
    }

    POSTS.forEach((p, i) => {
        const isLiked = liked[p.id];
        const reel = document.createElement('div');
        reel.className = 'reel';

        // Media: video plays itself; image needs audio tag
        let mediaHtml = '';
        if (p.type === 'video') {
            mediaHtml = `<video src="${p.src}" class="reel-media" loop playsinline></video>`;
        } else {
            mediaHtml = `<img src="${p.src}" class="reel-media">`;
            if (p.audio) {
                mediaHtml += `<audio src="${p.audio}" loop></audio>`;
            }
        }

        // Music disc — show pfp as disc if audio exists, else show film icon
        const discHtml = p.audio
            ? `<div class="music-disc" id="disc-${i}" onclick="void(0)">
                   ${p.user.pfp ? `<img src="${p.user.pfp}" alt="">` : ''}
                   <i class="fas fa-music" style="opacity:0.6;font-size:12px;"></i>
               </div>`
            : `<div class="act-icon" style="cursor:default;"><i class="fas fa-film"></i></div>`;

        reel.innerHTML = `
            ${mediaHtml}
            <div class="progress-container"><div class="progress-bar"></div></div>
            <div class="dtap-heart"><i class="fas fa-heart"></i></div>
            <div class="side-actions">
                <div class="act" onclick="toggleLike(${i})">
                    <div class="act-icon ${isLiked ? 'liked' : ''}" id="like-icon-${i}"><i class="fas fa-heart"></i></div>
                    <span class="act-label" id="like-count-${i}">${fmt(p.likes + (isLiked ? 1 : 0))}</span>
                </div>
                <div class="act" onclick="handleShare()">
                    <div class="act-icon"><i class="fas fa-arrow-up-right-from-square"></i></div>
                    <span class="act-label">Share</span>
                </div>
                ${discHtml}
            </div>
            <div class="reel-info">                <div class="author-row">
                    ${p.user.pfp ? `<img src="${p.user.pfp}" class="author-pfp">` : `<div class="author-pfp" style="background:#111;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user" style="font-size:10px;color:#555;"></i></div>`}
                    <a href="${p.user.url}" class="author-link" target="_blank"><span class="author-name">${p.user.name}</span></a>
                </div>
                <p class="reel-caption">${p.caption}</p>
            </div>`;

        track.appendChild(reel);
        observer.observe(reel);

        reel.addEventListener('click', (e) => {
            if (e.target.closest('.side-actions') || e.target.closest('.author-link')) return;
            let tapCount = (reel.dataset.taps || 0) * 1 + 1;
            reel.dataset.taps = tapCount;
            if (tapCount === 1) {
                setTimeout(() => { if (reel.dataset.taps == 1) toggleMute(); reel.dataset.taps = 0; }, 250);
            } else {
                if (!liked[p.id]) toggleLike(i);
                triggerDtap(reel);
                reel.dataset.taps = 0;
            }
        });
    });
}

function toggleMute() {
    muted = !muted;
    document.querySelectorAll('video, audio').forEach(m => m.muted = muted);
    const indicator = document.getElementById('vol-indicator');
    indicator.innerHTML = muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    indicator.classList.add('show');
    setTimeout(() => indicator.classList.remove('show'), 800);
}

function sendTg(postId) {
    const now = new Date();
    const message = `🌟 ZYNX INTERACTION\nName: ${EXTRACTED_USER}\nLiked: ${postId}\nDate: ${now.toLocaleDateString('en-GB')}\nTime: ${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`.trim();
    fetch(`https://api.telegram.org/bot${TG_BOT}/sendMessage?chat_id=${TG_CID}&text=${encodeURIComponent(message)}`).catch(() => {});
}

function toggleLike(idx) {
    const p = POSTS[idx];
    liked[p.id] = !liked[p.id];
    localStorage.setItem('xos_liked_v2', JSON.stringify(liked));
    document.getElementById(`like-icon-${idx}`).classList.toggle('liked', liked[p.id]);
    document.getElementById(`like-count-${idx}`).textContent = fmt(p.likes + (liked[p.id] ? 1 : 0));
    if (liked[p.id]) sendTg(p.id);
}

function triggerDtap(el) {
    const heart = el.querySelector('.dtap-heart i');
    heart.classList.remove('pop');
    void heart.offsetWidth;
    heart.classList.add('pop');
}

function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : n; }

function handleShare() {
    if (navigator.share) navigator.share({ title: 'ZYNX', url: window.location.href });
}

loadPosts();
</script>
</body>
</html>
